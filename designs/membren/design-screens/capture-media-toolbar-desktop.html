<!-- COMPONENT INVENTORY: sidebar-nav, page-panel, input, button-primary, button-secondary, icon, feeling-picker, person-picker
     NEW (register once approved): media-toolbar, media-chip — same component and states as
     capture-media-toolbar-mobile.html, laid out inside the existing page-panel/page-grid. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — New memory (media toolbar, desktop)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-subtle: #efece9;
        --surface-raised: #ffffff;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --ink-3: #a39a91;
        --ink-inverse: #ffffff;
        --border: #e8e4e0;
        --border-strong: #d8d2cb;
        --primary: #a8503a;
        --primary-soft-bg: #f6e9e5;
        --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --type-title-size: 22px;
        --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
        --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
        --sidebar-width-expanded: 220px; --page-max-width: 780px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--surface); font-family: var(--font-sans); }
      .desktop-shell { display: grid; grid-template-columns: var(--sidebar-width-expanded) 1fr; min-height: 100vh; }
      aside.sidebar { background: var(--surface-raised); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-3); gap: var(--space-6); }
      .brand-lockup { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); }
      .wordmark { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); }
      .sidebar-links { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
      .sidebar-links a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-2); border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; }
      .sidebar-links a[data-state="active"] { color: var(--primary); background: var(--primary-soft-bg); }
      main.content { background: var(--surface-subtle); overflow-y: auto; }
      .page-panel { max-width: var(--page-max-width); margin: 0 auto; padding: var(--space-6) var(--space-7) var(--space-7); }
      a.page-back { font-size: 13px; color: var(--ink-2); text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-5); }
      .page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
      .page-head h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
      .page-actions { display: flex; gap: var(--space-3); }
      .page-body { display: flex; flex-direction: column; gap: var(--space-5); }

      label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: var(--space-2); }
      .field-textarea { width: 100%; min-height: 180px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-family: var(--font-serif); font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--surface-raised); resize: none; }
      .field-textarea::placeholder { color: var(--ink-3); font-family: var(--font-sans); font-size: 14px; }

      .media-toolbar { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
      .media-toolbar button { width: 40px; height: 40px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--primary-soft-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .media-toolbar button:hover { border-color: var(--primary); }
      .media-toolbar button[data-state="disabled"] { background: var(--surface-subtle); color: var(--ink-3); border-color: var(--border); cursor: default; }
      .media-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
      .media-chip { position: relative; width: 72px; height: 72px; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-raised); border: 1px solid var(--border); }
      .media-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media-chip .remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--ink); color: var(--ink-inverse); font-size: 12px; line-height: 20px; text-align: center; border: none; cursor: pointer; }
      .media-chip .play-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .media-chip .play-badge span { width: 24px; height: 24px; border-radius: var(--radius-full); background: rgba(43, 36, 32, 0.55); display: flex; align-items: center; justify-content: center; }

      .field-emoji-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .field-emoji-picker button { min-width: 44px; min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; color: var(--ink); cursor: pointer; }
      .field-emoji-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }
      .field-person-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .field-person-picker button { min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 13px; color: var(--ink-2); cursor: pointer; }
      .field-person-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }

      .btn-secondary { min-height: 44px; padding: 0 var(--space-4); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
      .btn-primary { min-height: 44px; padding: 0 var(--space-4); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="desktop-shell" data-app="membren" data-screen="capture-media-toolbar-desktop" data-breakpoint="desktop">
      <aside class="sidebar" data-component="sidebar-nav" data-state="expanded">
        <div class="brand-lockup">
          <svg width="20" height="20" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M7 31V13c0-4.5 6-5.5 8.2-1.8L20 19.5 24.8 11.2C27 7.5 33 8.5 33 13V31" stroke="#a8503a" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="20" cy="31" r="2.6" fill="#2b2420" />
          </svg>
          <span class="wordmark">membren</span>
        </div>
        <nav class="sidebar-links" role="navigation" aria-label="Primary">
          <a data-state="active">＋ New memory</a>
          <a href="feed-desktop.html">⌂ Feed</a>
          <a href="#">☷ Settings</a>
        </nav>
      </aside>

      <main class="content">
        <div class="page-panel" data-component="page-panel" data-variant="capture">
          <a class="page-back" href="feed-desktop.html">← Feed</a>
          <div class="page-head">
            <h1>New memory</h1>
            <div class="page-actions">
              <button class="btn-secondary" data-component="button-secondary" onclick="location.href='feed-desktop.html'">Cancel</button>
              <button class="btn-primary" data-component="button-primary" data-primary-action="true" onclick="location.href='feed-desktop.html'">Save memory</button>
            </div>
          </div>

          <form class="page-body" data-focus-order="1,2,3,4">
            <div>
              <label class="field-label" for="note">What happened?</label>
              <textarea id="note" class="field-textarea" data-component="input" data-variant="textarea" placeholder="First steps. Four wobbly ones toward the fence…">First steps. Four wobbly ones toward the fence, then straight into my arms.</textarea>
              <div class="media-toolbar" data-component="media-toolbar" role="group" aria-label="Attach photo or video">
                <button type="button" aria-label="Add a photo, up to 3">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="camera">
                    <rect x="3" y="6" width="18" height="13" rx="2" /><circle cx="12" cy="12.5" r="3.3" />
                  </svg>
                </button>
                <button type="button" aria-label="Add a video">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="video">
                    <rect x="3" y="6" width="13" height="12" rx="2" /><path d="M16 10.5l5-2.5v8l-5-2.5" />
                  </svg>
                </button>
              </div>
              <div class="media-chips" data-component="media-chip">
                <div class="media-chip" data-kind="photo">
                  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><rect width='72' height='72' fill='%23e7c9a9'/></svg>" alt="Photo 1" />
                  <button type="button" class="remove" aria-label="Remove photo 1">×</button>
                </div>
                <div class="media-chip" data-kind="video-ready">
                  <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><rect width='72' height='72' fill='%236f8267'/></svg>" alt="Video poster frame" />
                  <span class="play-badge"><span><svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z" /></svg></span></span>
                  <button type="button" class="remove" aria-label="Remove video">×</button>
                </div>
              </div>
            </div>

            <div>
              <label class="field-label">How did it feel?</label>
              <div class="field-emoji-picker" data-component="feeling-picker" data-variant="chips">
                <button type="button" data-state="selected">🥹 moved</button>
                <button type="button">😊 happy</button>
                <button type="button">😌 relieved</button>
              </div>
            </div>

            <div>
              <label class="field-label">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
              <div class="field-person-picker" data-component="input" data-variant="person-picker">
                <button type="button" data-state="selected">Kai</button>
                <button type="button">Grandma Rita</button>
                <button type="button">+ Add person</button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
