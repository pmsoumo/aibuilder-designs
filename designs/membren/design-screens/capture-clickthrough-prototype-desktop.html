<!-- COMPONENT INVENTORY: sidebar-nav, page-panel, input, button-primary, button-secondary, icon, feeling-picker, media-toolbar, media-chip
     INTERACTIVE PROTOTYPE — not the canonical spec screen (that's capture-desktop.html). Same
     real interactivity as capture-clickthrough-prototype.html (mobile), desktop shell/sizing. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — New memory (clickthrough prototype, desktop)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-subtle: #efece9;
        --surface-raised: #ffffff;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --ink-3: #a39a91;
        --ink-inverse: #ffffff;
        --border: #e8e4e0;
        --border-strong: #d8d2cb;
        --primary: #a8503a;
        --primary-soft-bg: #f6e9e5;
        --accent: #6f8267;
        --error: #b3402c;
        --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --type-title-size: 22px;
        --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
        --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
        --sidebar-width-expanded: 220px; --page-max-width: 780px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--surface); font-family: var(--font-sans); }
      .concept-bar {
        background: var(--ink); color: #fff; font-size: 12px; padding: var(--space-2) var(--space-4);
        display: flex; justify-content: space-between; gap: var(--space-3);
      }
      .concept-bar a { color: #fff; text-decoration: underline; }
      .desktop-shell { display: grid; grid-template-columns: var(--sidebar-width-expanded) 1fr; min-height: calc(100vh - 34px); }
      aside.sidebar { background: var(--surface-raised); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-3); gap: var(--space-6); }
      .brand-lockup { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); }
      .wordmark { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); }
      .sidebar-links { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
      .sidebar-links a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-2); border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; }
      .sidebar-links a[data-state="active"] { color: var(--primary); background: var(--primary-soft-bg); }
      main.content { background: var(--surface-subtle); overflow-y: auto; }
      .page-panel { max-width: var(--page-max-width); margin: 0 auto; padding: var(--space-6) var(--space-7) var(--space-7); }
      a.page-back { font-size: 13px; color: var(--ink-2); text-decoration: none; display: inline-flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-5); cursor: pointer; }
      .page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
      .page-head h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
      .page-actions { display: flex; gap: var(--space-3); }
      .page-body { display: flex; flex-direction: column; gap: var(--space-5); }

      label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: var(--space-2); }
      .field-textarea { width: 100%; min-height: 180px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-family: var(--font-serif); font-size: 17px; line-height: 1.55; color: var(--ink); background: var(--surface-raised); resize: none; }
      .field-textarea::placeholder { color: var(--ink-3); font-family: var(--font-sans); font-size: 14px; }

      .media-toolbar { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
      .media-toolbar button { width: 40px; height: 40px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--primary-soft-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
      .media-toolbar button:hover:not(:disabled) { border-color: var(--primary); }
      .media-toolbar button:disabled { background: var(--surface-subtle); color: var(--ink-3); cursor: default; }
      .media-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
      .media-chip { position: relative; width: 72px; height: 72px; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-raised); border: 1px solid var(--border); cursor: pointer; }
      .media-chip[data-state="processing"] { opacity: 0.6; cursor: default; }
      .media-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media-chip .remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: var(--radius-full); background: var(--ink); color: var(--ink-inverse); font-size: 12px; line-height: 20px; text-align: center; border: none; cursor: pointer; }
      .field-preset-picker { display: flex; gap: var(--space-2); margin-top: var(--space-3); max-width: 320px; }
      .preset-thumb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-raised); padding: var(--space-2); cursor: pointer; }
      .preset-thumb .swatch { width: 100%; aspect-ratio: 1/1; border-radius: var(--radius-sm); background: linear-gradient(160deg, #e7c9a9, var(--primary) 120%); }
      .preset-thumb span { font-size: 12px; color: var(--ink-2); }
      .preset-thumb[data-state="selected"] { border-color: var(--primary); }
      .preset-thumb[data-state="selected"] span { color: var(--primary); font-weight: 600; }

      .video-inline-preview { position: relative; width: 100%; max-width: 420px; border-radius: var(--radius-md); overflow: hidden; margin-top: var(--space-2); background: #000; }
      .video-inline-preview video { width: 100%; display: block; max-height: 260px; }
      .video-remove { position: absolute; top: var(--space-1); right: var(--space-1); width: 32px; height: 32px; border-radius: var(--radius-full); border: none; background: rgba(43, 36, 32, 0.65); color: var(--ink-inverse); font-size: 16px; cursor: pointer; z-index: 2; }

      .feeling-toggle { display: flex; gap: var(--space-2); }
      .feeling-toggle-btn { min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; color: var(--ink); cursor: pointer; }
      .feeling-toggle-btn[data-valence="positive"], .feeling-toggle-btn[data-valence="negative"] { flex: 0 0 auto; min-width: 140px; font-weight: 600; }
      .feeling-toggle-btn[data-valence="custom"] { flex: 0 0 auto; font-size: 13px; color: var(--ink-2); border-style: dashed; }
      .feeling-toggle-btn[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); }
      .feeling-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
      @keyframes feeling-reveal { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
      .feeling-chips { animation: feeling-reveal 180ms cubic-bezier(0.16, 1, 0.3, 1); }
      .feeling-chips button { min-width: 44px; min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; color: var(--ink); cursor: pointer; }
      .feeling-chips button[disabled] { opacity: 0.35; cursor: not-allowed; }
      .feeling-confirmed { display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; font-size: 14px; max-width: 240px; margin-top: var(--space-2); }
      .feeling-confirmed button { background: none; border: none; color: var(--ink-2); font-size: 13px; font-weight: 600; text-decoration: underline; padding: var(--space-1); cursor: pointer; }
      .feeling-confirmed .feeling-remove { text-decoration: none; font-size: 18px; line-height: 1; color: var(--ink-2); }
      .field-custom-feeling { width: 100%; max-width: 320px; min-height: 40px; margin-top: var(--space-3); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: 14px; color: var(--ink); background: var(--surface-raised); }
      .feeling-add-another { min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px dashed var(--border); background: none; font-size: 13px; color: var(--ink-2); cursor: pointer; margin-top: var(--space-2); }
      #slot2 { margin-top: var(--space-2); }

      .field-person-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .field-person-picker button { min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 13px; color: var(--ink-2); cursor: pointer; }
      .field-person-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }
      .field-person-picker input { min-height: 40px; border: 1.5px solid var(--border); border-radius: var(--radius-full); padding: 0 var(--space-3); font-size: 13px; width: 120px; }

      .btn-secondary { min-height: 44px; padding: 0 var(--space-4); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
      .btn-primary { min-height: 44px; padding: 0 var(--space-4); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="concept-bar">
      <strong>Interactive concept — click through it</strong>
      <a href="capture-desktop.html">Static spec</a>
    </div>

    <div class="desktop-shell" data-app="membren" data-screen="capture-clickthrough-desktop">
      <aside class="sidebar" data-component="sidebar-nav" data-state="expanded">
        <div class="brand-lockup">
          <svg width="20" height="20" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <path d="M7 31V13c0-4.5 6-5.5 8.2-1.8L20 19.5 24.8 11.2C27 7.5 33 8.5 33 13V31" stroke="#a8503a" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="20" cy="31" r="2.6" fill="#2b2420" />
          </svg>
          <span class="wordmark">membren</span>
        </div>
        <nav class="sidebar-links" role="navigation" aria-label="Primary">
          <a data-state="active">＋ New memory</a>
          <a href="feed-desktop.html">⌂ Feed</a>
          <a href="#">☷ Settings</a>
        </nav>
      </aside>

      <main class="content">
        <div class="page-panel" data-component="page-panel" data-variant="capture">
          <a class="page-back" onclick="location.href='feed-desktop.html'">← Feed</a>
          <div class="page-head">
            <h1>New memory</h1>
            <div class="page-actions">
              <button class="btn-secondary" onclick="location.href='feed-desktop.html'">Cancel</button>
              <button class="btn-primary" onclick="location.href='feed-desktop.html'">Save memory</button>
            </div>
          </div>

          <form class="page-body" id="composerForm" onsubmit="return false">
            <div>
              <label class="field-label" for="note">What happened?</label>
              <textarea id="note" class="field-textarea" placeholder="First steps. Four wobbly ones toward the fence…"></textarea>

              <div class="media-toolbar">
                <button type="button" id="photoBtn" aria-label="Add a photo, up to 3" onclick="photoInput.click()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2" /><circle cx="12" cy="12.5" r="3.3" /></svg>
                </button>
                <button type="button" id="videoBtn" aria-label="Add a video" onclick="videoInput.click()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2" /><path d="M16 10.5l5-2.5v8l-5-2.5" /></svg>
                </button>
                <input type="file" id="photoInput" accept="image/*" hidden />
                <input type="file" id="videoInput" accept="video/*" hidden />
              </div>
              <div class="media-chips" id="mediaChips"></div>
              <div id="presetRow"></div>
              <div id="videoPreviewWrap"></div>
            </div>

            <div>
              <label class="field-label">How did it feel?</label>
              <div id="slot1"></div>
              <div id="addAnotherWrap"></div>
              <div id="slot2"></div>
            </div>

            <div>
              <label class="field-label">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
              <div class="field-person-picker" id="personPicker">
                <button type="button" data-name="Kai">Kai</button>
                <button type="button" data-name="Grandma Rita">Grandma Rita</button>
                <button type="button" id="addPersonBtn">+ Add person</button>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script>
      const POSITIVE = [["🥹","moved"],["😊","happy"],["😌","relieved"],["😇","grateful"],["😮","surprised"],["😆","funny"],["🕊️","peaceful"],["🥰","loved"]];
      const NEGATIVE = [["😭","overwhelmed"],["😡","angry"],["😖","stressed"],["😒","jealous"],["😢","sad"],["😞","disappointed"],["😤","frustrated"],["😔","helpless"],["😠","regretful"]];
      const MAX_PHOTOS = 3;

      const photoInput = document.getElementById("photoInput");
      const videoInput = document.getElementById("videoInput");
      const photoBtn = document.getElementById("photoBtn");
      const videoBtn = document.getElementById("videoBtn");
      const mediaChips = document.getElementById("mediaChips");
      const presetRow = document.getElementById("presetRow");
      const videoPreviewWrap = document.getElementById("videoPreviewWrap");

      let photos = [];
      let hasVideo = false;
      let activePhotoId = null;

      function presetFilter(name) {
        return name === "warm" ? "sepia(.35) saturate(1.3) brightness(1.05)" : name === "bright" ? "brightness(1.25) contrast(1.05)" : "none";
      }

      function renderChips() {
        mediaChips.innerHTML = "";
        photos.forEach((p) => {
          const chip = document.createElement("div");
          chip.className = "media-chip";
          chip.dataset.state = p.ready ? "ready" : "processing";
          chip.innerHTML = p.ready
            ? `<img src="${p.url}" style="filter:${presetFilter(p.preset)}" alt="Photo"><button type="button" class="remove" aria-label="Remove photo">×</button>`
            : `<img src="${p.url}" alt="Photo">`;
          if (p.ready) {
            chip.querySelector("img").onclick = () => openPreset(p.id);
            chip.querySelector(".remove").onclick = (e) => { e.stopPropagation(); removePhoto(p.id); };
          }
          mediaChips.appendChild(chip);
        });
        photoBtn.disabled = photos.length >= MAX_PHOTOS;
      }

      function openPreset(id) {
        if (activePhotoId === id) { activePhotoId = null; presetRow.innerHTML = ""; return; }
        activePhotoId = id;
        const p = photos.find((p) => p.id === id);
        presetRow.innerHTML = `
          <div class="field-preset-picker" role="radiogroup" aria-label="Photo look">
            <button type="button" class="preset-thumb" data-name="original" data-state="${p.preset === "original" ? "selected" : ""}"><span class="swatch"></span><span>Original</span></button>
            <button type="button" class="preset-thumb" data-name="warm" data-state="${p.preset === "warm" ? "selected" : ""}"><span class="swatch"></span><span>Warm</span></button>
            <button type="button" class="preset-thumb" data-name="bright" data-state="${p.preset === "bright" ? "selected" : ""}"><span class="swatch"></span><span>Bright</span></button>
          </div>`;
        presetRow.querySelectorAll(".preset-thumb").forEach((btn) => {
          btn.onclick = () => { p.preset = btn.dataset.name; renderChips(); openPreset(id); };
        });
      }

      function removePhoto(id) {
        photos = photos.filter((p) => p.id !== id);
        if (activePhotoId === id) { activePhotoId = null; presetRow.innerHTML = ""; }
        renderChips();
      }

      photoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file || photos.length >= MAX_PHOTOS) return;
        const id = "p" + Date.now() + Math.random();
        const url = URL.createObjectURL(file);
        photos.push({ id, url, ready: false, preset: "warm" });
        renderChips();
        setTimeout(() => {
          const p = photos.find((p) => p.id === id);
          if (p) { p.ready = true; renderChips(); }
        }, 500);
      });

      videoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file || hasVideo) return;
        hasVideo = true;
        videoBtn.disabled = true;
        const url = URL.createObjectURL(file);
        videoPreviewWrap.innerHTML = `
          <div class="video-inline-preview">
            <button type="button" class="video-remove" aria-label="Remove video">×</button>
            <video controls src="${url}"></video>
          </div>`;
        videoPreviewWrap.querySelector(".video-remove").onclick = () => {
          hasVideo = false; videoBtn.disabled = false; videoPreviewWrap.innerHTML = "";
        };
      });

      let feeling1 = null;
      let feeling2 = null;

      function chipsHTML(list, otherValue) {
        return list.map(([emoji, label]) =>
          `<button type="button" data-emoji="${emoji}" data-label="${label}" ${otherValue === label ? "disabled" : ""}>${emoji} ${label}</button>`
        ).join("");
      }

      function renderSlot1() {
        const el = document.getElementById("slot1");
        if (feeling1) {
          const label = feeling1.custom ? feeling1.custom : `${feeling1.emoji} ${feeling1.label}`;
          el.innerHTML = `<div class="feeling-confirmed"><span>${label}</span><span style="display:flex;align-items:center;gap:8px">
            <button type="button" id="changeSlot1">Change</button>
            ${feeling2 ? '<button type="button" class="feeling-remove" id="removeSlot1" aria-label="Remove this feeling">×</button>' : ""}
          </span></div>`;
          document.getElementById("changeSlot1").onclick = () => { feeling1 = null; renderSlot1(); renderAddAnother(); };
          const rm = document.getElementById("removeSlot1");
          if (rm) rm.onclick = () => { feeling1 = feeling2; feeling2 = null; renderSlot1(); renderSlot2(); renderAddAnother(); };
        } else {
          el.innerHTML = `
            <div class="feeling-toggle" role="radiogroup" aria-label="How did it feel, broadly">
              <button type="button" class="feeling-toggle-btn" data-valence="positive">🙂 Good</button>
              <button type="button" class="feeling-toggle-btn" data-valence="negative">😔 Hard</button>
              <button type="button" class="feeling-toggle-btn" data-valence="custom">💬 Something else</button>
            </div>
            <div id="slot1Chips"></div>`;
          el.querySelectorAll(".feeling-toggle-btn").forEach((btn) => {
            btn.onclick = () => {
              el.querySelectorAll(".feeling-toggle-btn").forEach((b) => delete b.dataset.state);
              btn.dataset.state = "selected";
              const chipsEl = document.getElementById("slot1Chips");
              const other = feeling2 && !feeling2.custom ? feeling2.label : null;
              if (btn.dataset.valence === "custom") {
                chipsEl.innerHTML = `<input type="text" class="field-custom-feeling" placeholder="Describe how it felt…">`;
                chipsEl.querySelector("input").onkeydown = (e) => {
                  if (e.key === "Enter" && e.target.value.trim()) { feeling1 = { custom: "💬 " + e.target.value.trim() }; renderSlot1(); renderAddAnother(); }
                };
              } else {
                const list = btn.dataset.valence === "positive" ? POSITIVE : NEGATIVE;
                chipsEl.innerHTML = `<div class="feeling-chips">${chipsHTML(list, other)}</div>`;
                chipsEl.querySelectorAll("button:not([disabled])").forEach((chip) => {
                  chip.onclick = () => { feeling1 = { emoji: chip.dataset.emoji, label: chip.dataset.label }; renderSlot1(); renderAddAnother(); };
                });
              }
            };
          });
        }
      }

      function renderAddAnother() {
        const el = document.getElementById("addAnotherWrap");
        el.innerHTML = feeling1 && !feeling2 ? `<button type="button" class="feeling-add-another" id="addAnotherBtn">+ Add another feeling</button>` : "";
        if (feeling1 && !feeling2) el.querySelector("#addAnotherBtn").onclick = () => { feeling2 = { pending: true }; renderAddAnother(); renderSlot2(); };
      }

      function renderSlot2() {
        const el = document.getElementById("slot2");
        if (!feeling2) { el.innerHTML = ""; return; }
        if (feeling2.pending) {
          el.innerHTML = `
            <div class="feeling-toggle" role="radiogroup" aria-label="A second feeling, broadly">
              <button type="button" class="feeling-toggle-btn" data-valence="positive">🙂 Good</button>
              <button type="button" class="feeling-toggle-btn" data-valence="negative">😔 Hard</button>
              <button type="button" class="feeling-toggle-btn" data-valence="custom">💬 Something else</button>
            </div>
            <div id="slot2Chips"></div>`;
          el.querySelectorAll(".feeling-toggle-btn").forEach((btn) => {
            btn.onclick = () => {
              el.querySelectorAll(".feeling-toggle-btn").forEach((b) => delete b.dataset.state);
              btn.dataset.state = "selected";
              const chipsEl = document.getElementById("slot2Chips");
              const other = feeling1 && !feeling1.custom ? feeling1.label : null;
              if (btn.dataset.valence === "custom") {
                chipsEl.innerHTML = `<input type="text" class="field-custom-feeling" placeholder="Describe the other feeling…">`;
                chipsEl.querySelector("input").onkeydown = (e) => {
                  if (e.key === "Enter" && e.target.value.trim()) { feeling2 = { custom: "💬 " + e.target.value.trim() }; renderSlot1(); renderSlot2(); }
                };
              } else {
                const list = btn.dataset.valence === "positive" ? POSITIVE : NEGATIVE;
                chipsEl.innerHTML = `<div class="feeling-chips">${chipsHTML(list, other)}</div>`;
                chipsEl.querySelectorAll("button:not([disabled])").forEach((chip) => {
                  chip.onclick = () => { feeling2 = { emoji: chip.dataset.emoji, label: chip.dataset.label }; renderSlot1(); renderSlot2(); };
                });
              }
            };
          });
        } else {
          const label = feeling2.custom ? feeling2.custom : `${feeling2.emoji} ${feeling2.label}`;
          el.innerHTML = `<div class="feeling-confirmed"><span>${label}</span><button type="button" class="feeling-remove" id="removeSlot2" aria-label="Remove this feeling">×</button></div>`;
          document.getElementById("removeSlot2").onclick = () => { feeling2 = null; renderSlot2(); renderAddAnother(); };
        }
      }

      renderSlot1();
      renderAddAnother();
      renderSlot2();

      const personPicker = document.getElementById("personPicker");
      function wirePersonButtons() {
        personPicker.querySelectorAll("button[data-name]").forEach((btn) => {
          btn.onclick = () => { btn.dataset.state = btn.dataset.state === "selected" ? "" : "selected"; };
        });
      }
      function wireAddPersonButton() {
        const addBtn = document.getElementById("addPersonBtn");
        addBtn.onclick = function () {
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Name";
          this.replaceWith(input);
          input.focus();
          input.onkeydown = (e) => {
            if (e.key === "Enter" && e.target.value.trim()) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.dataset.name = e.target.value.trim();
              btn.dataset.state = "selected";
              btn.textContent = e.target.value.trim();
              input.replaceWith(btn);
              const newAddBtn = document.createElement("button");
              newAddBtn.type = "button";
              newAddBtn.id = "addPersonBtn";
              newAddBtn.textContent = "+ Add person";
              personPicker.appendChild(newAddBtn);
              wirePersonButtons();
              wireAddPersonButton();
            }
          };
        };
      }
      wirePersonButtons();
      wireAddPersonButton();
    </script>
  </body>
</html>
