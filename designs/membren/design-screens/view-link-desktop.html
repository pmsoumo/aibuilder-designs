<!-- COMPONENT INVENTORY: memory-card, emotion-badge, button-secondary, icon -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — View-only link (desktop)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff; --surface-subtle: #efece9;
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91;
    --border: #e8e4e0;
    --primary: #a8503a; --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 24px;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-card: 0 0 0 1px var(--border);
    --content-max-width-desktop: 640px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-subtle); font-family: var(--font-sans); }
  /* no sidebar: recipient has no account, per data-condition="!user.isAuthenticated" — nothing to navigate to */
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

  div.read-only-banner { width: 100%; background: var(--surface-subtle); border-bottom: 1px solid var(--border); padding: var(--space-3) var(--space-5); display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
  div.read-only-banner .inner { width: 100%; max-width: var(--content-max-width-desktop); display: flex; align-items: center; gap: 6px; }

  .content-inner { width: 100%; max-width: var(--content-max-width-desktop); padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
  header.app-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0 0 4px; }
  header.app-header p { font-size: 14px; color: var(--ink-3); margin: 0; }

  article.memory-card { background: var(--surface-raised); box-shadow: var(--elevation-card); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  article.memory-card .photo { border-radius: var(--radius-md); aspect-ratio: 4/3; background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  article.memory-card .note { font-family: var(--font-serif); font-size: 16px; line-height: 1.55; color: var(--ink); margin: 0; }
  .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  time.entry-time { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  footer.cta-bar { width: 100%; border-top: 1px solid var(--border); background: var(--surface-raised); padding: var(--space-5); display: flex; justify-content: center; }
  .cta-inner { width: 100%; max-width: var(--content-max-width-desktop); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
  footer.cta-bar p { font-size: 13px; color: var(--ink-3); margin: 0; }
  .btn-secondary { min-height: 44px; padding: 0 var(--space-5); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="page" data-app="membren" data-screen="view-link-desktop" data-state="read-only" data-condition="!user.isAuthenticated" data-breakpoint="desktop">

  <div class="read-only-banner" role="note">
    <div class="inner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="eye"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      View only — shared by Kai's parent
    </div>
  </div>

  <div class="content-inner">
    <header class="app-header">
      <h1>Kai's moments</h1>
      <p>Shared with you</p>
    </header>

    <article class="memory-card" data-component="memory-card" data-variant="photo" data-state="photo-shared">
      <div class="photo" role="img" aria-label="Photo: first steps in the backyard"></div>
      <p class="note">First steps. Four wobbly ones toward the fence, then straight into my arms.</p>
      <div class="meta-row">
        <span class="badge-emotion" data-component="emotion-badge" data-state="moved">🥹 moved</span>
        <time class="entry-time">Today</time>
      </div>
    </article>

    <article class="memory-card" data-component="memory-card" data-variant="thought" data-state="thought-shared">
      <p class="note">He said "mama" for the first time today. I nearly dropped my phone.</p>
      <div class="meta-row">
        <span class="badge-emotion" data-component="emotion-badge" data-state="overwhelmed">😭 overwhelmed</span>
        <time class="entry-time">Yesterday</time>
      </div>
    </article>
  </div>

  <footer class="cta-bar">
    <div class="cta-inner">
      <p>This is a private memory space on membren.</p>
      <button class="btn-secondary" data-component="button-secondary" data-state="start-own">Start your own</button>
    </div>
  </footer>

</div>
</body>
</html>
