<!-- COMPONENT INVENTORY: share-trigger, filter-trigger, share-sheet, filter-sheet, bottom-nav, capture-tab, memory-card, emotion-badge, icon -->
<!-- Canonicalized 2026-09-21, replaces spaces.html (Spaces tab collapsed into a Feed-header share icon + this sheet). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Share sheet</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-subtle: #efece9; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.35);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0; --border-strong: #d8d2cb; --divider: #eeeae5;
    --primary: #a8503a; --primary-strong: #8a4230; --primary-soft-bg: #f6e9e5;
    --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 22px; --type-title-weight: 600;
    --type-note-size: 16px; --type-note-line: 1.55;
    --type-label-size: 13px; --type-label-weight: 600;
    --type-caption-size: 12px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-card: 0 0 0 1px var(--border);
    --elevation-panel: 0 8px 24px -8px rgba(43,36,32,0.14), 0 2px 4px -2px rgba(43,36,32,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: var(--font-sans); display: flex; justify-content: center; padding: 32px 12px; }
  .device { width: 375px; height: 780px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 1px 3px rgba(43,36,32,0.15); display: flex; flex-direction: column; position: relative; }

  header.app-header { padding: var(--space-5) var(--space-4) var(--space-3); display: flex; align-items: baseline; justify-content: space-between; }
  header.app-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: var(--type-title-weight); color: var(--ink); margin: 0; }
  .header-right { display: flex; align-items: center; gap: var(--space-3); }
  header.app-header time { font-size: var(--type-caption-size); color: var(--ink-3); }
  button.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; padding: 0; }

  main { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  h2.section-heading { font-size: var(--type-caption-size); color: var(--ink-3); font-weight: 600; margin: var(--space-2) 0 0; }
  article.memory-card { background: var(--surface-raised); box-shadow: var(--elevation-card); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  article.memory-card .note { font-family: var(--font-serif); font-size: var(--type-note-size); line-height: var(--type-note-line); color: var(--ink); margin: 0; }
  .badge-emotion { font-size: var(--type-label-size); background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: var(--type-label-weight); }
  time.entry-time { font-size: var(--type-caption-size); color: var(--ink-3); margin-left: auto; }

  nav.bottom-nav { display: flex; align-items: center; justify-content: space-around; padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: var(--surface-raised); position: sticky; bottom: 0; z-index: 10; }
  nav.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; min-height: 44px; justify-content: center; text-decoration: none; color: var(--ink-3); font-size: 11px; }
  nav.bottom-nav a[data-state="active"] { color: var(--primary); font-weight: 600; }
  nav.bottom-nav a.capture-tab .icon-circle { width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--primary); color: var(--ink-inverse); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(168,80,58,0.35); }
  nav.bottom-nav a:not(.capture-tab) .icon { font-size: 18px; }

  /* ===== share sheet ===== */
  .share-sheet-backdrop { position: absolute; inset: 0; background: var(--surface-overlay); display: flex; align-items: flex-end; }
  .share-sheet { width: 100%; background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--elevation-panel); padding: var(--space-5) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-height: 80vh; overflow-y: auto; }
  .share-sheet .sheet-handle { width: 36px; height: 4px; border-radius: var(--radius-full); background: var(--border-strong); margin: 0 auto; }
  .share-sheet-heading { display: flex; align-items: center; justify-content: space-between; }
  .share-sheet h2 { font-family: var(--font-serif); font-size: 18px; margin: 0; color: var(--ink); }
  .share-sheet .sub { font-size: 13px; color: var(--ink-2); margin: 0; }
  .share-sheet section { display: flex; flex-direction: column; gap: var(--space-2); }
  .share-sheet .field-label { font-size: var(--type-caption-size); font-weight: 600; color: var(--ink-2); }
  .share-sheet input[readonly] { min-height: 44px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: 13px; color: var(--ink-2); background: var(--surface-raised); }
  .share-sheet .btn-secondary-invite { min-height: 44px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg); background: transparent; color: var(--ink-2); font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; }
  .people-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip-person { font-size: var(--type-caption-size); color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-full); }
</style>
</head>
<body>

<div class="device" data-app="membren" data-screen="share-sheet">
  <header class="app-header">
    <h1>Feed</h1>
    <div class="header-right">
      <time datetime="2026-09-21">Mon, Sep 21</time>
      <button class="icon-btn" aria-label="Filter your feed" data-component="filter-trigger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="filter"><path d="M4 5h16l-6 8v6l-4-2v-4L4 5z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Share your feed" data-component="share-trigger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>
      </button>
    </div>
  </header>
  <main>
    <h2 class="section-heading">Recent</h2>
    <article class="memory-card" data-component="memory-card" data-variant="thought">
      <p class="note">He said "mama" for the first time today. I nearly dropped my phone.</p>
      <div class="meta-row" style="display:flex;align-items:center;gap:8px;">
        <span class="badge-emotion" data-component="emotion-badge">😭 overwhelmed</span>
        <time class="entry-time">Yesterday</time>
      </div>
    </article>
  </main>
  <div class="share-sheet-backdrop">
    <div class="share-sheet" data-component="share-sheet">
      <div class="sheet-handle"></div>
      <div class="share-sheet-heading">
        <h2>Share your feed</h2>
        <button class="icon-btn" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="sub">Anyone with this link can view — not edit or add.</p>
      <section aria-label="Invite link">
        <span class="field-label">View-only link</span>
        <input readonly value="https://membren.pages.dev/#/view/a8de49a…" />
      </section>
      <section aria-label="People">
        <span class="field-label">People in your memories</span>
        <div class="people-list">
          <span class="chip-person">Shaili</span>
          <span class="chip-person" style="border-style:dashed;cursor:pointer;">+ Add person</span>
        </div>
      </section>
    </div>
  </div>
  <nav class="bottom-nav" data-component="bottom-nav" role="navigation" aria-label="Primary">
    <a href="feed.html" data-state="active">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="home"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Feed
    </a>
    <a href="capture.html" class="capture-tab" data-component="capture-tab" aria-label="Capture a memory">
      <span class="icon-circle"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="plus"><path d="M12 5v14M5 12h14"/></svg></span>
    </a>
    <a href="#">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="settings"><path d="M4 6h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
      Settings
    </a>
  </nav>
</div>

</body>
</html>
