<!-- COMPONENT INVENTORY: modal-panel, input, button-primary, button-secondary, icon -->
<!-- Alternate desktop direction — composer expands into a centered modal (Facebook/Twitter "create post" convention), single column, not the side-drawer's two-column layout. Feed stays mounted, dimmed, behind it. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Capture (social variant, desktop modal)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-subtle: #efece9; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.45);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0; --border-strong: #d8d2cb;
    --primary: #a8503a; --primary-soft-bg: #f6e9e5;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 18px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-modal: 0 24px 48px -12px rgba(43,36,32,0.25);
    --z-modal: 1000; --z-overlay: 800;
    --modal-width-capture: 560px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--surface-subtle); font-family: var(--font-sans); }

  .modal-backdrop { position: fixed; inset: 0; background: var(--surface-overlay); z-index: var(--z-overlay); display: flex; align-items: flex-start; justify-content: center; padding: var(--space-6) var(--space-4); overflow-y: auto; }

  .modal-panel { width: 100%; max-width: var(--modal-width-capture); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elevation-modal); z-index: var(--z-modal); display: flex; flex-direction: column; }

  header.modal-header { padding: var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: center; position: relative; border-bottom: 1px solid var(--border); }
  header.modal-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
  button.icon-btn { position: absolute; right: var(--space-3); top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: var(--radius-full); border: none; background: var(--surface-subtle); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--ink-2); }
  button.icon-btn:hover { background: var(--border); color: var(--ink); }

  form { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }

  label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: var(--space-2); }

  .field-photo-preview { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-md); background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  .field-preset-picker { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
  .preset-thumb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-raised); padding: var(--space-1); }
  .preset-thumb .swatch { width: 100%; aspect-ratio: 1/1; border-radius: 8px; background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  .preset-thumb span { font-size: 12px; color: var(--ink-2); }
  .preset-thumb[data-state="selected"] { border-color: var(--primary); }
  .preset-thumb[data-state="selected"] span { color: var(--primary); font-weight: 600; }

  .field-textarea { width: 100%; min-height: 80px; border: none; padding: 0; font-family: var(--font-serif); font-size: 18px; line-height: 1.5; color: var(--ink); background: transparent; resize: none; }
  .field-textarea::placeholder { color: var(--ink-3); }

  .field-emoji-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-emoji-picker-positive { margin-bottom: var(--space-3); }
  .field-emoji-picker button { min-width: 44px; min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; color: var(--ink); cursor: pointer; }
  .field-emoji-picker button:hover { border-color: var(--border-strong); }
  .field-emoji-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }
  .picker-group-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.02em; }

  .field-person-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-person-picker button { min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .field-person-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }

  footer.action-bar { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border); display: flex; gap: var(--space-3); }
  .btn-secondary { flex: 0 0 auto; min-height: 44px; padding: 0 var(--space-4); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .btn-primary { flex: 1; min-height: 44px; background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div data-app="membren" data-screen="capture-social-desktop" data-breakpoint="desktop" data-variant="social">

  <!-- feed stays mounted behind at full opacity in the real build; this static mockup shows the modal alone over the dimmed backdrop -->
  <div class="modal-backdrop" data-interaction="close-modal" onclick="location.href='feed-social-desktop.html'">
    <div class="modal-panel" data-component="modal-panel" data-variant="capture" role="dialog" aria-modal="true" aria-label="New memory" onclick="event.stopPropagation()">
      <header class="modal-header">
        <h1>New memory</h1>
        <button class="icon-btn" aria-label="Close" onclick="location.href='feed-social-desktop.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <form data-focus-order="1,2,3,4">
        <div>
          <textarea class="field-textarea" data-component="input" data-variant="textarea" data-state="textarea" placeholder="What happened?" autofocus>First steps. Four wobbly ones toward the fence, then straight into my arms.</textarea>
        </div>

        <div>
          <div class="field-photo-preview" role="img" aria-label="Selected photo, Warm preset applied"></div>
          <div class="field-preset-picker" data-component="input" data-variant="preset-picker" data-state="preset-picker" role="radiogroup" aria-label="Photo look">
            <button type="button" class="preset-thumb"><span class="swatch"></span><span>Original</span></button>
            <button type="button" class="preset-thumb" data-state="selected"><span class="swatch"></span><span>Warm</span></button>
            <button type="button" class="preset-thumb"><span class="swatch"></span><span>Bright</span></button>
          </div>
        </div>

        <div>
          <label class="field-label">How did it feel?</label>
          <span class="picker-group-label">Positive</span>
          <div class="field-emoji-picker field-emoji-picker-positive" data-component="input" data-variant="emoji-picker" data-state="emoji-picker" data-validate="required" role="radiogroup" aria-label="Feeling">
            <button type="button" data-state="selected">🥹 moved</button>
            <button type="button">😂 delighted</button>
            <button type="button">😌 relieved</button>
            <button type="button">🥰 grateful</button>
            <button type="button">😮 surprised</button>
          </div>
          <span class="picker-group-label">Negative</span>
          <div class="field-emoji-picker field-emoji-picker-negative" role="radiogroup" aria-label="Feeling, continued">
            <button type="button">😭 overwhelmed</button>
            <button type="button">😠 angry</button>
            <button type="button">😖 stressed</button>
            <button type="button">😒 jealous</button>
            <button type="button">😢 sad</button>
            <button type="button">😞 disappointed</button>
            <button type="button">😤 frustrated</button>
            <button type="button">😔 helpless</button>
            <button type="button" data-state="custom-trigger">💬 something else</button>
          </div>
        </div>

        <div>
          <label class="field-label">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
          <div class="field-person-picker" data-component="input" data-variant="person-picker" data-state="person-picker">
            <button type="button" data-state="selected">Kai</button>
            <button type="button">Grandma Rita</button>
            <button type="button">+ Add person</button>
          </div>
        </div>
      </form>

      <footer class="action-bar">
        <button class="btn-secondary" data-component="button-secondary" data-state="cancel" onclick="location.href='feed-social-desktop.html'">Cancel</button>
        <button class="btn-primary" data-component="button-primary" data-state="save" data-primary-action="true" onclick="location.href='feed-social-desktop.html'">Save memory</button>
      </footer>
    </div>
  </div>

</div>
</body>
</html>
