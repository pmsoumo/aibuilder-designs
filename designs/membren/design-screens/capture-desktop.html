<!-- COMPONENT INVENTORY: sidebar-nav, drawer-panel, input, button-primary, button-secondary, icon -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Capture (desktop drawer)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-subtle: #efece9; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.35);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0; --border-strong: #d8d2cb;
    --primary: #a8503a; --primary-soft-bg: #f6e9e5;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 18px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-modal: 0 24px 48px -12px rgba(43,36,32,0.2);
    --z-panel: 900; --z-overlay: 800;
    --sidebar-width-expanded: 220px;
    --drawer-width-capture: 640px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); font-family: var(--font-sans); }

  .desktop-shell { display: grid; grid-template-columns: var(--sidebar-width-expanded) 1fr; min-height: 100vh; }
  .desktop-shell[data-sidebar="collapsed"] { grid-template-columns: var(--sidebar-width-collapsed) 1fr; }
  .desktop-shell[data-sidebar="collapsed"] .label,
  .desktop-shell[data-sidebar="collapsed"] .wordmark,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .label { display: none; }
  .desktop-shell[data-sidebar="collapsed"] .btn-capture,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-links a,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle { justify-content: center; padding: 0; }
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .icon { transform: rotate(180deg); }

  aside.sidebar { background: var(--surface-raised); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-3); gap: var(--space-6); }
  .sidebar-top { display: flex; flex-direction: column; gap: var(--space-4); }
  .wordmark { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); padding: 0 var(--space-2); white-space: nowrap; }
  .btn-capture { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sidebar-links { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
  .sidebar-links a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-2); border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sidebar-links a[data-state="active"] { color: var(--primary); background: var(--primary-soft-bg); }
  .sidebar-toggle { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-2); background: none; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; cursor: pointer; white-space: nowrap; }

  main.content { position: relative; background: var(--surface-subtle); }

  /* backdrop dims the feed behind the drawer, feed stays mounted underneath */
  .drawer-backdrop { position: absolute; inset: 0; background: var(--surface-overlay); z-index: var(--z-overlay); }

  aside.drawer-panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer-width-capture); background: var(--surface); box-shadow: var(--elevation-modal); z-index: var(--z-panel); display: flex; flex-direction: column; }

  header.drawer-header { padding: var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface-raised); flex-shrink: 0; }
  header.drawer-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
  button.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--ink-2); }
  button.icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }

  /* two columns only when a photo is present — photo+preset on the left, the rest on the right; nothing to put beside empty space otherwise */
  form { flex: 1; overflow-y: auto; padding: var(--space-5); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-content: start; }
  form[data-state="no-photo"] { grid-template-columns: 1fr; max-width: 380px; margin: 0 auto; }
  .form-col { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

  label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: var(--space-2); }

  .field-photo-preview { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-md); background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  .field-preset-picker { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
  .preset-thumb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface-raised); padding: var(--space-1); }
  .preset-thumb .swatch { width: 100%; aspect-ratio: 1/1; border-radius: 8px; background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  .preset-thumb span { font-size: 12px; color: var(--ink-2); }
  .preset-thumb[data-state="selected"] { border-color: var(--primary); }
  .preset-thumb[data-state="selected"] span { color: var(--primary); font-weight: 600; }

  .field-emoji-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-emoji-picker-positive { margin-bottom: var(--space-3); }
  .field-emoji-picker button { min-width: 44px; min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 14px; color: var(--ink); cursor: pointer; }
  .field-emoji-picker button:hover { border-color: var(--border-strong); }
  .field-emoji-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }
  .picker-group-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.02em; }

  .field-textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-family: var(--font-serif); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--surface-raised); resize: none; }

  .field-person-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-person-picker button { min-height: 40px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .field-person-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }

  footer.action-bar { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border); background: var(--surface-raised); display: flex; gap: var(--space-3); flex-shrink: 0; }
  .btn-secondary { flex: 0 0 auto; min-height: 44px; padding: 0 var(--space-4); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .btn-primary { flex: 1; min-height: 44px; background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="desktop-shell" data-app="membren" data-screen="capture-desktop" data-sidebar="expanded" data-breakpoint="desktop">

  <aside class="sidebar" data-component="sidebar-nav" data-state="expanded">
    <div class="sidebar-top">
      <span class="wordmark">membren</span>
      <button class="btn-capture" data-component="button-primary" data-state="capture-cta" data-primary-action="true" aria-label="Capture a memory" data-interaction="open-capture-drawer" onclick="location.href='capture-desktop.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="plus"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New memory</span>
      </button>
    </div>
    <nav class="sidebar-links" role="navigation" aria-label="Primary">
      <a href="feed-desktop.html" data-state="active">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="home"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="label">Feed</span>
      </a>
      <a href="#">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="settings"><path d="M4 6h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
        <span class="label">Settings</span>
      </a>
    </nav>
    <button class="sidebar-toggle" data-component="sidebar-toggle" aria-label="Collapse sidebar" data-interaction="toggle-sidebar" onclick="document.querySelector('.desktop-shell').dataset.sidebar = document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'expanded' : 'collapsed'; this.setAttribute('aria-label', document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'Expand sidebar' : 'Collapse sidebar')">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="collapse"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="label">Collapse</span>
    </button>
  </aside>

  <main class="content">
    <!-- feed stays mounted behind the drawer per the design decision: capture never navigates away from context -->
    <div class="drawer-backdrop" data-interaction="close-drawer" onclick="location.href='feed-desktop.html'"></div>

    <aside class="drawer-panel" data-component="drawer-panel" data-variant="capture" role="dialog" aria-modal="true" aria-label="New memory">
      <header class="drawer-header">
        <h1>New memory</h1>
        <button class="icon-btn" aria-label="Close" data-interaction="close-drawer" onclick="location.href='feed-desktop.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <!-- two-column-when-photo-present: real behavior toggles form[data-state] between "photo"/"no-photo" when the photo picker is used; this mockup renders the photo-present state -->
      <form data-focus-order="1,2,3,4" data-state="photo">
        <div class="form-col">
          <div>
            <label class="field-label" for="photo">Photo <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
            <div class="field-photo-preview" role="img" aria-label="Selected photo, Warm preset applied"></div>
            <div class="field-preset-picker" data-component="input" data-variant="preset-picker" data-state="preset-picker" role="radiogroup" aria-label="Photo look">
              <button type="button" class="preset-thumb"><span class="swatch"></span><span>Original</span></button>
              <button type="button" class="preset-thumb" data-state="selected"><span class="swatch"></span><span>Warm</span></button>
              <button type="button" class="preset-thumb"><span class="swatch"></span><span>Bright</span></button>
            </div>
          </div>
        </div>

        <div class="form-col">
          <div>
            <label class="field-label">How did it feel?</label>
            <span class="picker-group-label">Positive</span>
            <div class="field-emoji-picker field-emoji-picker-positive" data-component="input" data-variant="emoji-picker" data-state="emoji-picker" data-validate="required" role="radiogroup" aria-label="Feeling">
              <button type="button" data-state="selected">🥹 moved</button>
              <button type="button">😂 delighted</button>
              <button type="button">😌 relieved</button>
              <button type="button">🥰 grateful</button>
              <button type="button">😮 surprised</button>
            </div>
            <span class="picker-group-label">Negative</span>
            <div class="field-emoji-picker field-emoji-picker-negative" role="radiogroup" aria-label="Feeling, continued">
              <button type="button">😭 overwhelmed</button>
              <button type="button">😠 angry</button>
              <button type="button">😖 stressed</button>
              <button type="button">😒 jealous</button>
              <button type="button">😢 sad</button>
              <button type="button">😞 disappointed</button>
              <button type="button">😤 frustrated</button>
              <button type="button">😔 helpless</button>
              <button type="button" data-state="custom-trigger">💬 something else</button>
            </div>
          </div>

          <div>
            <label class="field-label" for="note">What happened?</label>
            <textarea id="note" class="field-textarea" data-component="input" data-variant="textarea" data-state="textarea" placeholder="First steps. Four wobbly ones toward the fence…">First steps. Four wobbly ones toward the fence, then straight into my arms.</textarea>
          </div>

          <div>
            <label class="field-label">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
            <div class="field-person-picker" data-component="input" data-variant="person-picker" data-state="person-picker">
              <button type="button" data-state="selected">Kai</button>
              <button type="button">Grandma Rita</button>
              <button type="button">+ Add person</button>
            </div>
          </div>
        </div>
      </form>

      <footer class="action-bar">
        <button class="btn-secondary" data-component="button-secondary" data-state="cancel" onclick="location.href='feed-desktop.html'">Cancel</button>
        <button class="btn-primary" data-component="button-primary" data-state="save" data-primary-action="true" onclick="location.href='feed-desktop.html'">Save memory</button>
      </footer>
    </aside>
  </main>

</div>
</body>
</html>
