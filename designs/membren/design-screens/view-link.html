<!-- COMPONENT INVENTORY: memory-card, emotion-badge, button-secondary -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — View-only link</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff; --surface-subtle: #efece9;
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0;
    --primary: #a8503a; --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 20px;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-card: 0 0 0 1px var(--border);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: var(--font-sans); display: flex; justify-content: center; padding: 32px 12px; }
  .device { width: 375px; min-height: 780px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 1px 3px rgba(43,36,32,0.15); display: flex; flex-direction: column; }

  div.read-only-banner { background: var(--surface-subtle); padding: var(--space-2) var(--space-4); display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }

  header.app-header { padding: var(--space-4); }
  header.app-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0 0 2px; }
  header.app-header p { font-size: 13px; color: var(--ink-3); margin: 0; }

  main { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }

  article.memory-card { background: var(--surface-raised); box-shadow: var(--elevation-card); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  article.memory-card .photo { border-radius: var(--radius-md); aspect-ratio: 4/3; background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  article.memory-card .note { font-family: var(--font-serif); font-size: 16px; line-height: 1.55; color: var(--ink); margin: 0; }
  .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  time.entry-time { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  footer.cta-bar { padding: var(--space-4); border-top: 1px solid var(--border); background: var(--surface-raised); text-align: center; display: flex; flex-direction: column; gap: var(--space-2); }
  footer.cta-bar p { font-size: 12px; color: var(--ink-3); margin: 0; }
  .btn-secondary { min-height: 44px; padding: 0 var(--space-4); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div class="device" data-app="membren" data-screen="view-link" data-state="read-only" data-condition="!user.isAuthenticated">

  <div class="read-only-banner" role="note">👁 View only — shared by Kai's parent</div>

  <header class="app-header">
    <h1>Kai's moments</h1>
    <p>Shared with you</p>
  </header>

  <main>
    <article class="memory-card" data-component="memory-card" data-variant="photo" data-state="photo-shared">
      <div class="photo" role="img" aria-label="Photo: first steps in the backyard"></div>
      <p class="note">First steps. Four wobbly ones toward the fence, then straight into my arms.</p>
      <div class="meta-row">
        <span class="badge-emotion" data-component="emotion-badge" data-state="moved">🥹 moved</span>
        <time class="entry-time">Today</time>
      </div>
    </article>

    <article class="memory-card" data-component="memory-card" data-variant="thought" data-state="thought-shared">
      <p class="note">He said "mama" for the first time today. I nearly dropped my phone.</p>
      <div class="meta-row">
        <span class="badge-emotion" data-component="emotion-badge" data-state="overwhelmed">😭 overwhelmed</span>
        <time class="entry-time">Yesterday</time>
      </div>
    </article>
  </main>

  <footer class="cta-bar">
    <p>This is a private memory space on membren.</p>
    <button class="btn-secondary" data-component="button-secondary" data-state="start-own">Start your own</button>
  </footer>

</div>
</body>
</html>
