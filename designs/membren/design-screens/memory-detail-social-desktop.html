<!-- COMPONENT INVENTORY: modal-panel, emotion-badge, person-chip, button-primary, icon -->
<!-- Alternate desktop direction — clicking a memory opens a large centered modal (Facebook lightbox convention), never a second page. Feed stays mounted, dimmed, behind it. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Memory detail (social variant, desktop modal)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.45);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0;
    --primary: #a8503a; --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-modal: 0 24px 48px -12px rgba(43,36,32,0.25);
    --z-modal: 1000; --z-overlay: 800;
    --modal-width-detail: 680px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--surface); font-family: var(--font-sans); }

  .modal-backdrop { position: fixed; inset: 0; background: var(--surface-overlay); z-index: var(--z-overlay); display: flex; align-items: flex-start; justify-content: center; padding: var(--space-6) var(--space-4); overflow-y: auto; }

  .modal-panel { width: 100%; max-width: var(--modal-width-detail); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elevation-modal); z-index: var(--z-modal); overflow: hidden; }

  .photo-lg { width: 100%; aspect-ratio: 16/10; background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); position: relative; }
  button.icon-btn { position: absolute; top: var(--space-3); right: var(--space-3); width: 36px; height: 36px; border-radius: var(--radius-full); border: none; background: rgba(43,36,32,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: #fff; }
  button.icon-btn:hover { background: rgba(43,36,32,0.7); }

  .detail-body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
  time.entry-date { font-size: 13px; color: var(--ink-3); }
  p.note-lg { font-family: var(--font-serif); font-size: 21px; line-height: 1.6; color: var(--ink); margin: 0; }
  .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  .chip-person { font-size: 12px; color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 3px 10px; border-radius: var(--radius-full); }
  .btn-primary { align-self: flex-start; min-height: 44px; padding: 0 var(--space-5); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div data-app="membren" data-screen="memory-detail-social-desktop" data-breakpoint="desktop" data-variant="social">

  <div class="modal-backdrop" data-interaction="close-modal" onclick="location.href='feed-social-desktop.html'">
    <div class="modal-panel" data-component="modal-panel" data-variant="detail" role="dialog" aria-modal="true" aria-label="Memory detail" onclick="event.stopPropagation()">
      <div class="photo-lg" role="img" aria-label="Photo: first steps in the backyard">
        <button class="icon-btn" aria-label="Close" onclick="location.href='feed-social-desktop.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="detail-body">
        <time class="entry-date" datetime="2026-09-22">Yesterday, 5:40pm</time>
        <p class="note-lg">First steps. Four wobbly ones toward the fence, then straight into my arms. He looked so proud of himself he almost forgot to keep going.</p>
        <div class="meta-row">
          <span class="badge-emotion" data-component="emotion-badge" data-state="moved">🥹 moved</span>
          <span class="chip-person" data-component="person-chip" data-state="kai">Kai</span>
        </div>
        <button class="btn-primary" data-component="button-primary" data-state="share" data-primary-action="true" onclick="location.href='share-sheet-desktop.html'">Share this memory</button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
