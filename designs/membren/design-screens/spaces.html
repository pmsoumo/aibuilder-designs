<!-- COMPONENT INVENTORY: bottom-nav, capture-tab, button-secondary, person-chip, space-card -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Spaces</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff;
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0; --border-strong: #d8d2cb;
    --primary: #a8503a;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 22px;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-card: 0 0 0 1px var(--border);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: var(--font-sans); display: flex; justify-content: center; padding: 32px 12px; }
  .device { width: 375px; min-height: 780px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 1px 3px rgba(43,36,32,0.15); display: flex; flex-direction: column; }

  header.app-header { padding: var(--space-5) var(--space-4) var(--space-3); }
  header.app-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }

  main { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }

  h2.section-heading { font-size: 12px; color: var(--ink-3); font-weight: 600; margin: 0 0 var(--space-2); }

  .space-card { background: var(--surface-raised); box-shadow: var(--elevation-card); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .space-card .title-row { display: flex; align-items: center; justify-content: space-between; }
  .space-card h3 { font-family: var(--font-serif); font-size: 17px; font-weight: 600; color: var(--ink); margin: 0; }
  .space-card .member-count { font-size: 12px; color: var(--ink-3); }
  .space-card p { font-size: 13px; color: var(--ink-2); margin: 0; }

  .btn-secondary-invite { width: 100%; min-height: 56px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg); background: transparent; color: var(--ink-2); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }

  div.people-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip-person { font-size: 12px; color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 3px 10px; border-radius: var(--radius-full); }

  nav.bottom-nav { display: flex; align-items: center; justify-content: space-around; padding: var(--space-2) var(--space-4); border-top: 1px solid var(--border); background: var(--surface-raised); }
  nav.bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 44px; min-height: 44px; justify-content: center; text-decoration: none; color: var(--ink-3); font-size: 11px; }
  nav.bottom-nav a[data-state="active"] { color: var(--primary); font-weight: 600; }
  nav.bottom-nav a.capture-tab .icon { width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--primary); color: var(--ink-inverse); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-top: -18px; box-shadow: 0 2px 6px rgba(168,80,58,0.35); }
  nav.bottom-nav a:not(.capture-tab) .icon { font-size: 18px; }
</style>
</head>
<body>
<div class="device" data-app="membren" data-screen="spaces">

  <header class="app-header"><h1>Spaces</h1></header>

  <main>
    <section aria-label="Your space">
      <h2 class="section-heading">Your space</h2>
      <div class="space-card" data-component="space-card">
        <div class="title-row">
          <h3>Kai's moments</h3>
          <span class="member-count">Just you</span>
        </div>
        <p>Every memory you capture lives here until you invite family in.</p>
      </div>
    </section>

    <section aria-label="Invite">
      <button class="btn-secondary-invite" data-component="button-secondary" data-variant="invite" data-state="invite">+ Invite family to this space</button>
    </section>

    <section aria-label="People">
      <h2 class="section-heading">People</h2>
      <div class="people-list">
        <span class="chip-person" data-component="person-chip" data-state="kai">Kai</span>
        <span class="chip-person" data-component="person-chip" data-state="grandma-rita">Grandma Rita</span>
        <span class="chip-person" data-component="person-chip" data-state="add-person">+ Add person</span>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" data-component="bottom-nav" role="navigation" aria-label="Primary">
    <a href="feed.html"><span class="icon">🏠</span>Feed</a>
    <a href="capture.html" class="capture-tab" data-component="capture-tab" aria-label="Capture a memory"><span class="icon">+</span></a>
    <a href="spaces.html" data-state="active"><span class="icon">👪</span>Spaces</a>
  </nav>

</div>
</body>
</html>
