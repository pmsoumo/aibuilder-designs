<!-- COMPONENT INVENTORY: account-settings, confirmation-dialog, bottom-nav, capture-tab, button-secondary, icon -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — Account (mobile)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-raised: #ffffff;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --border: #e8e4e0;
        --primary: #a8503a;
        --error: #b3402c;
        --surface-overlay: rgba(43, 36, 32, 0.35);
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius-lg: 16px;
        --font-serif:
          ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #e9e7e4;
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: 32px 12px;
      }
      .device {
        width: 375px;
        min-height: 780px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      header.app-header {
        padding: var(--space-5) var(--space-4) var(--space-3);
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 600;
        color: var(--ink);
      }
      .content {
        flex: 1;
        padding: var(--space-4);
      }
      .account-section {
        margin-bottom: var(--space-5);
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: var(--space-2);
        text-transform: uppercase;
      }
      .account-row {
        background: var(--surface-raised);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--space-2);
      }
      .account-row.danger {
        color: var(--error);
      }
      .account-row button { width: 100%; min-height: 44px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      .account-row .arrow { color: var(--ink-2); }
      .confirmation-backdrop { position: absolute; inset: 0; display: flex; align-items: end; background: var(--surface-overlay); z-index: 800; }
      .confirmation-dialog { width: 100%; max-width: 100%; box-sizing: border-box; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--surface-raised); padding: var(--space-5) var(--space-4); }
      .confirmation-dialog h2 { margin: 0; font-family: var(--font-serif); font-size: 22px; color: var(--ink); }
      .confirmation-dialog p { margin: var(--space-2) 0 var(--space-4); color: var(--ink-2); font-size: 14px; line-height: 1.5; }
      .confirmation-dialog label { display: block; color: var(--ink); font-size: 13px; font-weight: 600; margin-bottom: var(--space-2); }
      .confirmation-dialog input { box-sizing: border-box; width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: 12px; padding: 0 var(--space-3); font: inherit; color: var(--ink); }
      .dialog-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
      .dialog-actions button { flex: 1; min-height: 44px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; }
      .cancel { background: var(--surface-raised); border: 1px solid var(--border); color: var(--ink); }
      .delete { background: var(--error); border: 1px solid var(--error); color: #fff; }
      .delete:disabled { background: var(--border); border-color: var(--border); color: var(--ink-2); cursor: not-allowed; }
      }
      nav.bottom-nav {
        display: flex;
        justify-content: space-around;
        padding: var(--space-3) var(--space-2);
        border-top: 1px solid var(--border);
        background: var(--surface-raised);
      }
      nav.bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        text-decoration: none;
        color: var(--ink-2);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="device">
      <header class="app-header">Account</header>
      <main class="content" data-component="account-settings" data-state="mobile">
        <div class="account-section">
          <div class="section-title">Identity</div>
          <div class="account-row">
            <span>Email</span>
            <span style="color: var(--ink-2)">user@example.com</span>
          </div>
        </div>
        <div class="account-section">
          <div class="section-title">Legal</div>
          <a
            href="/legal/privacy"
            class="account-row"
            style="text-decoration: none; color: var(--ink)"
          >
            <span>Privacy Policy</span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>
          <a
            href="/legal/terms"
            class="account-row"
            style="text-decoration: none; color: var(--ink)"
          >
            <span>Terms and Conditions</span>
            <span class="arrow" aria-hidden="true">›</span>
          </a>
        </div>
        <div class="account-section">
          <div class="section-title">Danger Zone</div>
          <div class="account-row danger">
            <button type="button" data-interaction="open-delete-confirmation" onclick="openDialog()">Delete account</button>
          </div>
          <div class="account-row" style="cursor: pointer">
            <span style="color: var(--ink)">Sign out</span>
          </div>
        </div>
      </main>
      <div id="delete-dialog" class="confirmation-backdrop" data-component="confirmation-dialog" data-variant="sheet" data-state="closed-mobile" role="presentation" hidden>
        <section class="confirmation-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-heading" onclick="event.stopPropagation()">
          <h2 id="delete-heading">Delete your account?</h2>
          <p>This permanently removes your memories, photos, and public links. It cannot be undone.</p>
          <label for="delete-confirmation">Type DELETE to continue</label>
          <input id="delete-confirmation" autocomplete="off" data-validate="required|exact:DELETE" oninput="syncDelete(this.value)" />
          <div class="dialog-actions">
            <button class="cancel" type="button" onclick="closeDialog()">Cancel</button>
            <button id="delete-action" class="delete" type="button" disabled>Delete account</button>
          </div>
        </section>
      </div>
      <nav
        class="bottom-nav"
        data-component="bottom-nav"
        role="navigation"
        aria-label="Primary"
      >
        <a href="feed.html">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 11l8-7 8 7" />
            <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" />
          </svg>
          Feed
        </a>
        <a href="capture.html" class="capture-tab">
          <span class="icon-circle"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M12 5v14M5 12h14" /></svg
          ></span>
        </a>
        <a href="#" data-state="active">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 6h16" />
            <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
            <path d="M4 12h16" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <path d="M4 18h16" />
            <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
          </svg>
          Settings
        </a>
      </nav>
    </div>
    <script>
      const dialog = document.getElementById('delete-dialog');
      function openDialog() { dialog.hidden = false; dialog.dataset.state = 'open-mobile'; document.getElementById('delete-confirmation').focus(); }
      function closeDialog() { dialog.hidden = true; dialog.dataset.state = 'closed-mobile'; document.getElementById('delete-confirmation').value = ''; syncDelete(''); }
      function syncDelete(value) { document.getElementById('delete-action').disabled = value !== 'DELETE'; }
      dialog.addEventListener('click', closeDialog);
    </script>
  </body>
</html>
