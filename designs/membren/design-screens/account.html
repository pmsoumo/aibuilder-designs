<!-- COMPONENT INVENTORY: bottom-nav, capture-tab, button-primary, icon -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — Account (mobile)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-raised: #ffffff;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --border: #e8e4e0;
        --primary: #a8503a;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius-lg: 16px;
        --font-serif:
          ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #e9e7e4;
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: 32px 12px;
      }
      .device {
        width: 375px;
        min-height: 780px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header.app-header {
        padding: var(--space-5) var(--space-4) var(--space-3);
        font-family: var(--font-serif);
        font-size: 22px;
        font-weight: 600;
        color: var(--ink);
      }
      .content {
        flex: 1;
        padding: var(--space-4);
      }
      .account-section {
        margin-bottom: var(--space-5);
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: var(--space-2);
        text-transform: uppercase;
      }
      .account-row {
        background: var(--surface-raised);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--space-2);
      }
      .account-row.danger {
        color: var(--primary);
      }
      .account-row.disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      nav.bottom-nav {
        display: flex;
        justify-content: space-around;
        padding: var(--space-3) var(--space-2);
        border-top: 1px solid var(--border);
        background: var(--surface-raised);
      }
      nav.bottom-nav a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-1);
        text-decoration: none;
        color: var(--ink-2);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="device">
      <header class="app-header">Account</header>
      <main class="content">
        <div class="account-section">
          <div class="section-title">Identity</div>
          <div class="account-row">
            <span>Email</span>
            <span style="color: var(--ink-2)">user@example.com</span>
          </div>
        </div>
        <div class="account-section">
          <div class="section-title">Legal</div>
          <a
            href="/legal/privacy"
            class="account-row"
            style="text-decoration: none; color: var(--ink)"
          >
            <span>Privacy Policy</span>
          </a>
          <a
            href="/legal/terms"
            class="account-row"
            style="text-decoration: none; color: var(--ink)"
          >
            <span>Terms and Conditions</span>
          </a>
        </div>
        <div class="account-section">
          <div class="section-title">Danger Zone</div>
          <div class="account-row danger disabled">
            <span>Delete account</span>
            <span>Coming soon</span>
          </div>
          <div class="account-row" style="cursor: pointer">
            <span style="color: var(--ink)">Sign out</span>
          </div>
        </div>
      </main>
      <nav
        class="bottom-nav"
        data-component="bottom-nav"
        role="navigation"
        aria-label="Primary"
      >
        <a href="feed.html">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 11l8-7 8 7" />
            <path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9" />
          </svg>
          Feed
        </a>
        <a href="capture.html" class="capture-tab">
          <span class="icon-circle"
            ><svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M12 5v14M5 12h14" /></svg
          ></span>
        </a>
        <a href="#" data-state="active">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 6h16" />
            <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
            <path d="M4 12h16" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <path d="M4 18h16" />
            <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
          </svg>
          Settings
        </a>
      </nav>
    </div>
  </body>
</html>
