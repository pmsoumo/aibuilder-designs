<!-- COMPONENT INVENTORY: sidebar-nav, drawer-panel, emotion-badge, person-chip, button-primary, icon -->
<!-- Scope: 1024-1279px tier only. At >=1280px feed-desktop.html's built-in split-pane (detail-pane) replaces this drawer — see design-system.md 4.17. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Memory detail (desktop drawer, 1024-1279px)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-subtle: #efece9; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.35);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0;
    --primary: #a8503a; --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 18px;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-modal: 0 24px 48px -12px rgba(43,36,32,0.2);
    --z-panel: 900; --z-overlay: 800;
    --sidebar-width-expanded: 220px;
    --drawer-width: 440px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); font-family: var(--font-sans); }

  .desktop-shell { display: grid; grid-template-columns: var(--sidebar-width-expanded) 1fr; min-height: 100vh; }
  .desktop-shell[data-sidebar="collapsed"] { grid-template-columns: var(--sidebar-width-collapsed) 1fr; }
  .desktop-shell[data-sidebar="collapsed"] .label,
  .desktop-shell[data-sidebar="collapsed"] .wordmark,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .label { display: none; }
  .desktop-shell[data-sidebar="collapsed"] .btn-capture,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-links a,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle { justify-content: center; padding: 0; }
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .icon { transform: rotate(180deg); }
  aside.sidebar { background: var(--surface-raised); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-3); gap: var(--space-6); }
  .sidebar-top { display: flex; flex-direction: column; gap: var(--space-4); }
  .wordmark { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); padding: 0 var(--space-2); white-space: nowrap; }
  .btn-capture { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sidebar-links { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
  .sidebar-links a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-2); border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sidebar-links a[data-state="active"] { color: var(--primary); background: var(--primary-soft-bg); }
  .sidebar-toggle { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-2); background: none; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; cursor: pointer; white-space: nowrap; }

  main.content { position: relative; background: var(--surface-subtle); }
  .drawer-backdrop { position: absolute; inset: 0; background: var(--surface-overlay); z-index: var(--z-overlay); }
  aside.drawer-panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer-width); background: var(--surface); box-shadow: var(--elevation-modal); z-index: var(--z-panel); display: flex; flex-direction: column; }

  header.drawer-header { padding: var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface-raised); flex-shrink: 0; }
  header.drawer-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
  button.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--ink-2); }

  main.drawer-body { flex: 1; overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
  .photo { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-lg); background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }
  time.entry-date { font-size: 13px; color: var(--ink-3); }
  p.note { font-family: var(--font-serif); font-size: 19px; line-height: 1.6; color: var(--ink); margin: 0; }
  .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  .chip-person { font-size: 12px; color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 3px 10px; border-radius: var(--radius-full); }

  footer.action-bar { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border); background: var(--surface-raised); flex-shrink: 0; }
  .btn-primary { width: 100%; min-height: 44px; background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="desktop-shell" data-app="membren" data-screen="memory-detail-desktop" data-sidebar="expanded" data-breakpoint="desktop">

  <aside class="sidebar" data-component="sidebar-nav" data-state="expanded">
    <div class="sidebar-top">
      <span class="wordmark">membren</span>
      <button class="btn-capture" data-component="button-primary" data-state="capture-cta" data-primary-action="true" aria-label="Capture a memory" data-interaction="open-capture-drawer" onclick="location.href='capture-desktop.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="plus"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New memory</span>
      </button>
    </div>
    <nav class="sidebar-links" role="navigation" aria-label="Primary">
      <a href="feed-desktop.html" data-state="active">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="home"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="label">Feed</span>
      </a>
      <a href="#">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="settings"><path d="M4 6h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
        <span class="label">Settings</span>
      </a>
    </nav>
    <button class="sidebar-toggle" data-component="sidebar-toggle" aria-label="Collapse sidebar" data-interaction="toggle-sidebar" onclick="document.querySelector('.desktop-shell').dataset.sidebar = document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'expanded' : 'collapsed'; this.setAttribute('aria-label', document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'Expand sidebar' : 'Collapse sidebar')">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="collapse"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="label">Collapse</span>
    </button>
  </aside>

  <main class="content">
    <div class="drawer-backdrop" data-interaction="close-drawer" onclick="location.href='feed-desktop.html'"></div>

    <aside class="drawer-panel" data-component="drawer-panel" data-variant="detail" role="dialog" aria-modal="true" aria-label="Memory detail">
      <header class="drawer-header">
        <h1>Today, 5:40pm</h1>
        <button class="icon-btn" aria-label="Close" data-interaction="close-drawer" onclick="location.href='feed-desktop.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <main class="drawer-body">
        <div class="photo" role="img" aria-label="Photo: first steps in the backyard"></div>
        <p class="note">First steps. Four wobbly ones toward the fence, then straight into my arms. He looked so proud of himself he almost forgot to keep going.</p>
        <div class="meta-row">
          <span class="badge-emotion" data-component="emotion-badge" data-state="moved">🥹 moved</span>
          <span class="chip-person" data-component="person-chip" data-state="kai">Kai</span>
        </div>
      </main>

      <footer class="action-bar">
        <button class="btn-primary" data-component="button-primary" data-state="share" data-primary-action="true" onclick="location.href='share-sheet-desktop.html'">Share this memory</button>
      </footer>
    </aside>
  </main>

</div>
</body>
</html>
