<!-- COMPONENT INVENTORY: button-primary, button-secondary, icon, feeling-picker, input, person-picker
     NEW (exploratory — not yet registered): chat-log, chat-bubble-prompt, quick-reply-chip
     VARIANT B — hybrid. Same conversation-log visual language as Variant A (prompt bubbles framing
     each field), but every step renders and is answerable at once — no forced order, no hidden
     steps. Chat LOOK, form SPEED: tests whether the transcript aesthetic can be had without paying
     the sequential-reveal tax on a fast capture. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — New memory (chat log, all steps open)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-raised: #ffffff;
        --surface-subtle: #efece9;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --ink-3: #a39a91;
        --ink-inverse: #ffffff;
        --border: #e8e4e0;
        --border-strong: #d8d2cb;
        --primary: #a8503a;
        --primary-soft-bg: #f6e9e5;
        --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-full: 9999px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #e9e7e4;
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: 32px 12px;
      }
      .device {
        width: 375px;
        min-height: 780px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(43, 36, 32, 0.15);
        display: flex;
        flex-direction: column;
      }
      header.app-header {
        padding: var(--space-4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: var(--surface-raised);
      }
      header.app-header a.close { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
      header.app-header h1 { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); margin: 0; }
      header.app-header span.spacer { width: 44px; }

      .chat-log {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      .step { display: flex; flex-direction: column; gap: var(--space-2); }
      .bubble-prompt {
        align-self: flex-start;
        max-width: 90%;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-3) var(--space-4);
        font-size: 15px;
        color: var(--ink);
      }
      .step .field-input { margin-left: var(--space-2); }
      .field-textarea {
        width: 100%;
        min-height: 84px;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-md);
        padding: var(--space-3);
        font-family: var(--font-serif);
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--surface-raised);
        resize: none;
      }
      .quick-replies { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .chip {
        min-height: 44px;
        padding: 0 var(--space-3);
        border-radius: var(--radius-full);
        border: 1.5px solid var(--border);
        background: var(--surface-raised);
        font-size: 14px;
        color: var(--ink);
      }
      .chip[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }
      .chip[data-variant="skip"] { border-style: dashed; color: var(--ink-2); }
      .photo-row { display: flex; gap: var(--space-2); }
      .photo-picker-btn {
        flex: 1;
        min-height: 52px;
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
        font-size: 14px;
        color: var(--ink-2);
      }
      footer.action-bar {
        padding: var(--space-4);
        border-top: 1px solid var(--border);
        background: var(--surface-raised);
        display: flex;
        gap: var(--space-3);
      }
      .btn-secondary {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 var(--space-4);
        background: var(--surface-raised);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-md);
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .btn-primary {
        flex: 1;
        min-height: 44px;
        background: var(--primary);
        color: var(--ink-inverse);
        border: none;
        border-radius: var(--radius-md);
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="device" data-app="membren" data-screen="capture-chat-log" data-state="all-steps-open">
      <header class="app-header">
        <a href="feed.html" class="close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </a>
        <h1>New memory</h1>
        <span class="spacer"></span>
      </header>

      <div class="chat-log" data-component="chat-log" aria-label="New memory, all steps open">
        <div class="step">
          <div class="bubble-prompt" data-component="chat-bubble-prompt">What happened, or start with a photo or video?</div>
          <div class="field-input">
            <textarea class="field-textarea" placeholder="First steps. Four wobbly ones toward the fence…">First steps. Four wobbly ones toward the fence, then straight into my arms.</textarea>
            <div class="photo-row" style="margin-top:8px;">
              <button type="button" class="photo-picker-btn">📷 Add a photo</button>
              <button type="button" class="photo-picker-btn">🎥 Add a video</button>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="bubble-prompt" data-component="chat-bubble-prompt">How did it feel?</div>
          <div class="field-input quick-replies" data-component="quick-reply-chip">
            <button type="button" class="chip" data-state="selected">🥹 moved</button>
            <button type="button" class="chip">😊 happy</button>
            <button type="button" class="chip">😌 relieved</button>
            <button type="button" class="chip" data-variant="skip">Skip</button>
          </div>
        </div>

        <div class="step">
          <div class="bubble-prompt" data-component="chat-bubble-prompt">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></div>
          <div class="field-input quick-replies">
            <button type="button" class="chip" data-state="selected">Kai</button>
            <button type="button" class="chip">Grandma Rita</button>
            <button type="button" class="chip">+ Add person</button>
          </div>
        </div>

        <div class="step">
          <div class="bubble-prompt" data-component="chat-bubble-prompt">When was this?</div>
          <div class="field-input quick-replies">
            <button type="button" class="chip" data-state="selected">Today</button>
            <button type="button" class="chip">Pick a date</button>
          </div>
        </div>
      </div>

      <footer class="action-bar">
        <button type="button" class="btn-secondary" data-component="button-secondary" onclick="location.href='feed.html'">Cancel</button>
        <button type="button" class="btn-primary" data-component="button-primary" data-primary-action="true" onclick="location.href='feed.html'">Save memory</button>
      </footer>
    </div>
  </body>
</html>
