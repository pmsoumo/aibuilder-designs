<!-- COMPONENT INVENTORY: sidebar-nav, account-settings, confirmation-dialog, button-secondary, icon -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>membren — Account (desktop)</title>
    <style>
      :root {
        --surface: #f7f6f5;
        --surface-raised: #ffffff;
        --ink: #2b2420;
        --ink-2: #6b6058;
        --border: #e8e4e0;
        --primary: #a8503a;
        --error: #b3402c;
        --surface-overlay: rgba(43, 36, 32, 0.35);
        --space-1: 4px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --font-serif:
          ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #e9e7e4;
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        padding: 32px 12px;
      }
      .desktop-shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        width: 100%;
        max-width: 1200px;
        min-height: 800px;
        background: var(--surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .sidebar {
        background: var(--surface-raised);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: var(--space-4);
      }
      .sidebar-links {
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        flex: 1;
      }
      .sidebar-links a {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-height: 44px;
        padding: 0 var(--space-2);
        border-radius: var(--radius-md);
        text-decoration: none;
        color: var(--ink-2);
        font-size: 14px;
        font-weight: 600;
      }
      .sidebar-account {
        padding-top: var(--space-4);
        border-top: 1px solid var(--border);
      }
      .account-block {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: var(--space-2);
        border-radius: var(--radius-md);
        background: var(--primary-soft-bg, #f6e9e5);
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      .content {
        padding: var(--space-5);
      }
      .account-grid {
        max-width: 600px;
        display: grid;
        gap: var(--space-5);
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        text-transform: uppercase;
        margin-bottom: var(--space-3);
      }
      .account-row {
        background: var(--surface-raised);
        padding: var(--space-3) var(--space-4);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: var(--space-2);
      }
      .account-row.danger {
        color: var(--error);
      }
      .account-row button { width: 100%; min-height: 44px; border: 0; background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; }
      .arrow { color: var(--ink-2); }
      .confirmation-backdrop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-overlay); }
      .confirmation-dialog { width: 420px; max-width: calc(100vw - 48px); background: var(--surface-raised); border-radius: var(--radius-lg); box-shadow: 0 24px 48px -12px rgba(43, 36, 32, 0.2); padding: var(--space-5); }
      .confirmation-dialog h2 { margin: 0; font-family: var(--font-serif); font-size: 22px; color: var(--ink); }
      .confirmation-dialog p { margin: var(--space-3) 0 var(--space-4); color: var(--ink-2); font-size: 14px; line-height: 1.5; }
      .confirmation-dialog label { display: block; color: var(--ink); font-size: 13px; font-weight: 600; margin-bottom: var(--space-2); }
      .confirmation-dialog input { box-sizing: border-box; width: 100%; min-height: 44px; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font: inherit; }
      .dialog-actions { display: flex; justify-content: end; gap: var(--space-2); margin-top: var(--space-4); }
      .dialog-actions button { min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer; }
      .cancel { border: 1px solid var(--border); background: var(--surface-raised); color: var(--ink); }
      .delete { border: 1px solid var(--error); background: var(--error); color: #fff; }
      .delete:disabled { border-color: var(--border); background: var(--border); color: var(--ink-2); cursor: not-allowed; }
      }
    </style>
  </head>
  <body>
    <div class="desktop-shell">
      <aside class="sidebar">
        <div class="sidebar-links">
          <a href="capture-desktop.html">New memory</a>
          <a href="feed-desktop.html">Feed</a>
          <a href="#">Settings</a>
        </div>
        <div class="sidebar-account">
          <a href="account-desktop.html" class="account-block">
            Account settings
          </a>
        </div>
      </aside>
      <main
        class="content"
        data-component="account-settings"
        data-state="desktop"
      >
        <div class="account-grid">
          <h1>Account</h1>
          <div class="account-section">
            <div class="section-title">Identity</div>
            <div class="account-row">
              <span>Email</span>
              <span style="color: var(--ink-2)">user@example.com</span>
            </div>
          </div>
          <div class="account-section">
            <div class="section-title">Legal</div>
            <a
              href="/legal/privacy"
              class="account-row"
              style="text-decoration: none; color: var(--ink)"
            >
              <span>Privacy Policy</span>
              <span class="arrow" aria-hidden="true">›</span>
            </a>
            <a
              href="/legal/terms"
              class="account-row"
              style="text-decoration: none; color: var(--ink)"
            >
              <span>Terms and Conditions</span>
              <span class="arrow" aria-hidden="true">›</span>
            </a>
          </div>
          <div class="account-section">
            <div class="section-title">Danger Zone</div>
            <div class="account-row danger">
              <button
                type="button"
                data-interaction="open-delete-confirmation"
                onclick="openDialog()"
              >
                Delete account
              </button>
            </div>
            <div class="account-row" style="cursor: pointer">
              <span style="color: var(--ink)">Sign out</span>
            </div>
          </div>
        </div>
      </main>
      <div
        id="delete-dialog"
        class="confirmation-backdrop"
        data-component="confirmation-dialog"
        data-variant="modal"
        data-state="closed-desktop"
        role="presentation"
        hidden
      >
        <section
          class="confirmation-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="delete-heading"
          onclick="event.stopPropagation()"
        >
          <h2 id="delete-heading">Delete your account?</h2>
          <p>
            This permanently removes your memories, photos, and public links. It
            cannot be undone.
          </p>
          <label for="delete-confirmation">Type DELETE to continue</label>
          <input
            id="delete-confirmation"
            autocomplete="off"
            data-validate="required|exact:DELETE"
            oninput="syncDelete(this.value)"
          />
          <div class="dialog-actions">
            <button class="cancel" type="button" onclick="closeDialog()">
              Cancel
            </button>
            <button id="delete-action" class="delete" type="button" disabled>
              Delete account
            </button>
          </div>
        </section>
      </div>
    </div>
    <script>
      const dialog = document.getElementById("delete-dialog");
      function openDialog() {
        dialog.hidden = false;
        dialog.dataset.state = "open-desktop";
        document.getElementById("delete-confirmation").focus();
      }
      function closeDialog() {
        dialog.hidden = true;
        dialog.dataset.state = "closed-desktop";
        document.getElementById("delete-confirmation").value = "";
        syncDelete("");
      }
      function syncDelete(value) {
        document.getElementById("delete-action").disabled = value !== "DELETE";
      }
      dialog.addEventListener("click", closeDialog);
    </script>
  </body>
</html>
