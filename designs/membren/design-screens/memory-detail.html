<!-- COMPONENT INVENTORY: emotion-badge, person-chip, button-primary, icon -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Memory detail</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff;
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0;
    --primary: #a8503a; --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: var(--font-sans); display: flex; justify-content: center; padding: 32px 12px; }
  .device { width: 375px; min-height: 780px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 1px 3px rgba(43,36,32,0.15); display: flex; flex-direction: column; }

  header.app-header { padding: var(--space-4); display: flex; align-items: center; justify-content: space-between; }
  header.app-header a, header.app-header button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); font-size: 18px; background: none; border: none; }

  main { flex: 1; overflow-y: auto; padding: 0 var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }

  .photo { width: 100%; aspect-ratio: 4/3; border-radius: var(--radius-lg); background: linear-gradient(160deg, #e7c9a9, #a8503a 120%); }

  time.entry-date { font-size: 13px; color: var(--ink-3); }
  p.note { font-family: var(--font-serif); font-size: 19px; line-height: 1.6; color: var(--ink); margin: 0; }

  .meta-row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  .chip-person { font-size: 12px; color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 3px 10px; border-radius: var(--radius-full); }

  footer.action-bar { padding: var(--space-4); border-top: 1px solid var(--border); background: var(--surface-raised); }
  .btn-primary { width: 100%; min-height: 44px; background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="device" data-app="membren" data-screen="memory-detail">

  <header class="app-header">
    <a href="feed.html" class="icon-link" aria-label="Back to feed">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="back"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <button aria-label="More options" data-interaction="menu">⋯</button>
  </header>

  <main>
    <div class="photo" role="img" aria-label="Photo: first steps in the backyard"></div>
    <time class="entry-date" datetime="2026-09-20">Today, 5:40pm</time>
    <p class="note">First steps. Four wobbly ones toward the fence, then straight into my arms. He looked so proud of himself he almost forgot to keep going.</p>
    <div class="meta-row">
      <span class="badge-emotion" data-component="emotion-badge" data-state="moved">🥹 moved</span>
      <span class="badge-emotion" data-component="emotion-badge" data-state="relieved">😌 relieved</span>
      <span class="chip-person" data-component="person-chip" data-state="kai">Kai</span>
    </div>
  </main>

  <footer class="action-bar">
    <button class="btn-primary" data-component="button-primary" data-state="share" data-primary-action="true" onclick="location.href='view-link.html'">Share this memory</button>
  </footer>

</div>
</body>
</html>
