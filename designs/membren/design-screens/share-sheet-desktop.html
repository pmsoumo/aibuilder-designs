<!-- COMPONENT INVENTORY: sidebar-nav, share-sheet, memory-card, emotion-badge, icon -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Share (desktop modal)</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-subtle: #efece9; --surface-raised: #ffffff; --surface-overlay: rgba(43,36,32,0.35);
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91;
    --border: #e8e4e0; --border-strong: #d8d2cb;
    --primary: #a8503a;
    --accent: #6f8267; --accent-soft-bg: #eef1ec;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-note-size: 16px; --type-note-line: 1.55; --type-caption-size: 12px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
    --elevation-card: 0 0 0 1px var(--border);
    --elevation-modal: 0 24px 48px -12px rgba(43,36,32,0.2);
    --z-modal: 1000; --z-overlay: 800;
    --sidebar-width-expanded: 220px; --sidebar-width-collapsed: 72px;
    --content-max-width-desktop: 640px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface); font-family: var(--font-sans); }
  .desktop-shell { display: grid; grid-template-columns: var(--sidebar-width-expanded) 1fr; min-height: 100vh; }
  .desktop-shell[data-sidebar="collapsed"] { grid-template-columns: var(--sidebar-width-collapsed) 1fr; }
  .desktop-shell[data-sidebar="collapsed"] .label,
  .desktop-shell[data-sidebar="collapsed"] .wordmark,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .label { display: none; }
  .desktop-shell[data-sidebar="collapsed"] .btn-capture,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-links a,
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle { justify-content: center; padding: 0; }
  .desktop-shell[data-sidebar="collapsed"] .sidebar-toggle .icon { transform: rotate(180deg); }
  aside.sidebar { background: var(--surface-raised); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-5) var(--space-3); gap: var(--space-6); }
  .sidebar-top { display: flex; flex-direction: column; gap: var(--space-4); }
  .wordmark { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--ink); padding: 0 var(--space-2); white-space: nowrap; }
  .btn-capture { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sidebar-links { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
  .sidebar-links a { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: 0 var(--space-2); border-radius: var(--radius-md); text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sidebar-links a[data-state="active"] { color: var(--primary); background: var(--primary-soft-bg); }
  .sidebar-toggle { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-2); background: none; border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--ink-2); font-size: 13px; cursor: pointer; white-space: nowrap; }

  main.content { position: relative; display: flex; justify-content: center; }
  .content-inner { width: 100%; max-width: var(--content-max-width-desktop); padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
  h2.section-heading { font-size: var(--type-caption-size); color: var(--ink-3); font-weight: 600; margin: 0; }
  article.memory-card { background: var(--surface-raised); box-shadow: var(--elevation-card); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  article.memory-card .note { font-family: var(--font-serif); font-size: var(--type-note-size); line-height: var(--type-note-line); color: var(--ink); margin: 0; }
  .badge-emotion { font-size: 13px; background: var(--accent-soft-bg); color: var(--accent); padding: 3px 10px; border-radius: var(--radius-full); font-weight: 600; }
  time.entry-time { font-size: var(--type-caption-size); color: var(--ink-3); margin-left: auto; }

  .modal-backdrop { position: fixed; inset: 0; background: var(--surface-overlay); z-index: var(--z-overlay); display: flex; align-items: center; justify-content: center; }
  .share-modal { width: 420px; max-width: calc(100vw - 48px); background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--elevation-modal); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); z-index: var(--z-modal); }
  .share-modal-heading { display: flex; align-items: center; justify-content: space-between; }
  .share-modal h2 { font-family: var(--font-serif); font-size: 18px; margin: 0; color: var(--ink); }
  .share-modal .sub { font-size: 13px; color: var(--ink-2); margin: 0; }
  .share-modal section { display: flex; flex-direction: column; gap: var(--space-2); }
  .field-label { font-size: var(--type-caption-size); font-weight: 600; color: var(--ink-2); }
  .share-modal input[readonly] { min-height: 40px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-3); font-size: 13px; color: var(--ink-2); background: var(--surface-raised); }
  .people-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .chip-person { font-size: var(--type-caption-size); color: var(--ink-2); background: var(--surface-raised); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-full); }
  button.icon-btn { width: 32px; height: 32px; border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--ink-2); }
</style>
</head>
<body>
<div class="desktop-shell" data-app="membren" data-screen="share-sheet-desktop" data-sidebar="expanded" data-breakpoint="desktop">

  <aside class="sidebar" data-component="sidebar-nav" data-state="expanded">
    <div class="sidebar-top">
      <span class="wordmark">membren</span>
      <button class="btn-capture" data-component="button-primary" data-state="capture-cta" data-primary-action="true" aria-label="Capture a memory" data-interaction="open-capture-drawer" onclick="location.href='capture-desktop.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="plus"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">New memory</span>
      </button>
    </div>
    <nav class="sidebar-links" role="navigation" aria-label="Primary">
      <a href="feed-desktop.html" data-state="active">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="home"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span class="label">Feed</span>
      </a>
      <a href="#">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="settings"><path d="M4 6h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><path d="M4 12h16"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M4 18h16"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg>
        <span class="label">Settings</span>
      </a>
    </nav>
    <button class="sidebar-toggle" data-component="sidebar-toggle" aria-label="Collapse sidebar" data-interaction="toggle-sidebar" onclick="document.querySelector('.desktop-shell').dataset.sidebar = document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'expanded' : 'collapsed'; this.setAttribute('aria-label', document.querySelector('.desktop-shell').dataset.sidebar === 'collapsed' ? 'Expand sidebar' : 'Collapse sidebar')">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-component="icon" data-variant="collapse"><path d="M15 6l-6 6 6 6"/></svg>
      <span class="label">Collapse</span>
    </button>
  </aside>

  <main class="content">
    <div class="content-inner">
      <h2 class="section-heading">Recent</h2>
      <article class="memory-card" data-component="memory-card" data-variant="thought">
        <p class="note">He said "mama" for the first time today. I nearly dropped my phone.</p>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge-emotion" data-component="emotion-badge">😭 overwhelmed</span>
          <time class="entry-time">Yesterday</time>
        </div>
      </article>
    </div>

    <!-- desktop uses a centered modal (data-variant="modal") instead of mobile's bottom sheet — this is a short action list, not a scrolling form, so a modal reads as a quick dialog rather than a big drawer -->
    <div class="modal-backdrop" data-interaction="close-modal" onclick="location.href='feed-desktop.html'">
      <div class="share-modal" data-component="share-sheet" data-variant="modal" role="dialog" aria-modal="true" aria-label="Share your feed" onclick="event.stopPropagation()">
        <div class="share-modal-heading">
          <h2>Share your feed</h2>
          <button class="icon-btn" aria-label="Close" onclick="location.href='feed-desktop.html'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="sub">Anyone with this link can view — not edit or add.</p>
        <section aria-label="Invite link">
          <span class="field-label">View-only link</span>
          <input readonly value="https://membren.pages.dev/#/view/a8de49a…" />
        </section>
        <section aria-label="People">
          <span class="field-label">People in your memories</span>
          <div class="people-list">
            <span class="chip-person">Shaili</span>
            <span class="chip-person" style="border-style:dashed;cursor:pointer;">+ Add person</span>
          </div>
        </section>
      </div>
    </div>
  </main>

</div>
</body>
</html>
