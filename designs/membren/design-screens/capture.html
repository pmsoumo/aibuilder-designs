<!-- COMPONENT INVENTORY: input, button-primary, button-secondary, icon -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>membren — Capture</title>
<style>
  :root {
    --surface: #f7f6f5; --surface-raised: #ffffff; --surface-subtle: #efece9;
    --ink: #2b2420; --ink-2: #6b6058; --ink-3: #a39a91; --ink-inverse: #ffffff;
    --border: #e8e4e0; --border-strong: #d8d2cb;
    --primary: #a8503a; --primary-soft-bg: #f6e9e5;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --type-title-size: 18px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e7e4; font-family: var(--font-sans); display: flex; justify-content: center; padding: 32px 12px; }
  .device { width: 375px; min-height: 780px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 1px 3px rgba(43,36,32,0.15); display: flex; flex-direction: column; }

  header.app-header { padding: var(--space-4); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface-raised); }
  header.app-header a.close { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink-2); font-size: 20px; }
  header.app-header h1 { font-family: var(--font-serif); font-size: var(--type-title-size); font-weight: 600; color: var(--ink); margin: 0; }
  header.app-header span.spacer { width: 44px; }

  form { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }

  label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: var(--space-2); }

  .field-photo-picker { width: 100%; aspect-ratio: 16/10; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--ink-2); font-family: var(--font-sans); font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); }
  .field-photo-picker .icon { font-size: 26px; }

  .field-emoji-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-emoji-picker button { min-width: 44px; min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 15px; color: var(--ink); }
  .field-emoji-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }

  .field-textarea { width: 100%; min-height: 96px; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3); font-family: var(--font-serif); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--surface-raised); resize: none; }
  .field-textarea::placeholder { color: var(--ink-3); font-family: var(--font-sans); font-size: 14px; }

  .field-person-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .field-person-picker button { min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1.5px solid var(--border); background: var(--surface-raised); font-size: 13px; color: var(--ink-2); }
  .field-person-picker button[data-state="selected"] { border-color: var(--primary); background: var(--primary-soft-bg); color: var(--primary); font-weight: 600; }

  footer.action-bar { padding: var(--space-4); border-top: 1px solid var(--border); background: var(--surface-raised); display: flex; gap: var(--space-3); }
  .btn-secondary { flex: 0 0 auto; min-height: 44px; padding: 0 var(--space-4); background: var(--surface-raised); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; color: var(--ink); }
  .btn-primary { flex: 1; min-height: 44px; background: var(--primary); color: var(--ink-inverse); border: none; border-radius: var(--radius-md); font-family: var(--font-sans); font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<div class="device" data-app="membren" data-screen="capture">

  <header class="app-header">
    <a href="feed.html" class="close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-component="icon" data-variant="close"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <h1>New memory</h1>
    <span class="spacer"></span>
  </header>

  <form data-focus-order="1,2,3,4">
    <div>
      <label class="field-label" for="photo">Photo <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
      <button type="button" id="photo" class="field-photo-picker" data-component="input" data-variant="photo-picker" data-state="photo-picker">
        <span class="icon">📷</span>
        Add a photo
      </button>
    </div>

    <div>
      <label class="field-label">How did it feel?</label>
      <div class="field-emoji-picker" data-component="input" data-variant="emoji-picker" data-state="emoji-picker" data-validate="required" role="radiogroup" aria-label="Feeling">
        <button type="button" data-state="selected">🥹 moved</button>
        <button type="button">😂 delighted</button>
        <button type="button">😭 overwhelmed</button>
        <button type="button">😌 relieved</button>
        <button type="button">🥰 grateful</button>
        <button type="button">😮 surprised</button>
      </div>
    </div>

    <div>
      <label class="field-label" for="note">What happened?</label>
      <textarea id="note" class="field-textarea" data-component="input" data-variant="textarea" data-state="textarea" placeholder="First steps. Four wobbly ones toward the fence…">First steps. Four wobbly ones toward the fence, then straight into my arms.</textarea>
    </div>

    <div>
      <label class="field-label">Who's this about? <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
      <div class="field-person-picker" data-component="input" data-variant="person-picker" data-state="person-picker">
        <button type="button" data-state="selected">Kai</button>
        <button type="button">Grandma Rita</button>
        <button type="button">+ Add person</button>
      </div>
    </div>
  </form>

  <footer class="action-bar">
    <button class="btn-secondary" data-component="button-secondary" data-state="cancel" onclick="location.href='feed.html'">Cancel</button>
    <button class="btn-primary" data-component="button-primary" data-state="save" data-primary-action="true" onclick="location.href='feed.html'">Save memory</button>
  </footer>

</div>
</body>
</html>
